name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a GitHub release checks everything and publishes to npm.
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/generate.mjs --check
      - run: npx tsc --noEmit
      # Node 22 strips types only behind a flag; 24 does it by default.
      - run: node --experimental-strip-types --test "test/**/*.test.ts"
      - run: npm run build
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          for f in README.md LICENSE-MIT LICENSE-APACHE dist/index.js dist/index.d.ts; do
            node -e 'const p=require("./pack.json")[0].files.map(f=>f.path); if(!p.includes(process.argv[1])){console.error("missing "+process.argv[1]);process.exit(1)}' "$f"
          done

  oldest:
    # The oldest Node supported: the built package, with the polyfill.
    name: Runtime (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: |
          node --input-type=module -e '
            import { Temporal } from "temporal-polyfill";
            import { Client, NoTemporal } from "./dist/index.js";
            new Client({ temporal: Temporal });
            try { new Client(); process.exit(1); } catch (e) { if (!(e instanceof NoTemporal)) throw e; }
            console.log("ok");'

  publish:
    name: Publish
    if: github.event_name == 'release'
    needs: [test, oldest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
